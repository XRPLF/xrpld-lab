[project]
name = "xrpld-lab"
version = "3.5.0"
description = "Build xrpld networks and standalone ledgers"
authors = [{ name = "Denis Angell", email = "dangell@transia.co" }]
readme = "README.md"
license = { text = "ISC" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyyaml>=6.0.1,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "xrpld-publisher>=2.0.0,<3.0.0",
    "xrpl-py>=2.6.0,<3.0.0",
]

[project.scripts]
xrpld-lab = "xrpld_lab.cli:main"

[project.urls]
Repository = "https://github.com/XRPLF/xrpld-lab"

[tool.poetry]
packages = [
    { include = "xrpld_lab" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.1"
pytest-cov = "^5.0.0"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
