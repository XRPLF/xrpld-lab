[project]
name = "xrpld-lab"
version = "5.0.0"
description = "Build xrpld networks and standalone ledgers"
authors = [{ name = "Denis Angell", email = "dangell@transia.co" }]
readme = "README.md"
license = "ISC"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyyaml>=6.0.1,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "xrpld-publisher>=3.0.0,<4.0.0",
    "xrpl-py>=5.0.0,<6.0.0",
]

[project.scripts]
xrpld-lab = "xrpld_lab.cli:main"

[project.urls]
Repository = "https://github.com/XRPLF/xrpld-lab"

[tool.poetry]
packages = [
    { include = "xrpld_lab" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
