name: Python CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-venv-3.10-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Lint with flake8
        run: poetry run flake8 .

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-venv-3.10-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests with coverage
        run: poetry run pytest tests --cov=xrpld_lab --cov-report=term-missing --cov-fail-under=100

  cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Start Docker daemon
        run: |
          sudo systemctl start docker
          docker info

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-venv-3.10-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: CLI help
        run: |
          poetry run xrpld-lab --help
          poetry run xrpld-lab create:network --help
          poetry run xrpld-lab up:standalone --help
          poetry run xrpld-lab up:local --help

      - name: Standalone ledger starts and stops
        run: |
          poetry run xrpld-lab up:standalone
          sleep 5
          docker logs xrpl
          docker ps | grep xrpl
          poetry run xrpld-lab down:standalone --version 3.3.0
